const movies=SNAPSHOT.movies;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('updated').textContent=new Date(SNAPSHOT.exportedAt).toLocaleString('zh-HK');
const regions=[...new Set(movies.map(m=>m.region))].sort();for(const r of regions){const o=document.createElement('option');o.value=r;o.textContent=r;$('region').appendChild(o)}
const years=[...new Set(movies.map(m=>(m.date||'').slice(0,4)).filter(x=>/^\d{4}$/.test(x)))].sort().reverse();for(const y of years){const o=document.createElement('option');o.value=y;o.textContent=y;$('year').appendChild(o)}
function render(){const q=$('q').value.trim().toLocaleLowerCase(),status=$('status').value,region=$('region').value,rating=$('rating').value,year=$('year').value,sort=$('sort').value;let data=movies.filter(m=>(!q||(m.title+' '+m.original).toLocaleLowerCase().includes(q))&&(!region||m.region===region)&&(!year||(m.date||'').startsWith(year))&&(!status||(status==='watched'?m.watched:status==='unwatched'?!m.watched:m.favorite))&&(!rating||(rating==='unrated'?m.rating==null:rating==='le5'?m.rating!=null&&m.rating<=5:m.rating!=null&&m.rating>=Number(rating))));data.sort((a,b)=>sort==='old'?(a.date||'').localeCompare(b.date||''):sort==='score'?(b.rating||0)-(a.rating||0):sort==='title'?a.title.localeCompare(b.title):(b.date||'').localeCompare(a.date||''));$('count').textContent=`顯示 ${data.length} / ${movies.length} 部電影`;$('grid').innerHTML=data.length?data.map(m=>`<article class="movie">${m.poster?`<img class="poster" loading="lazy" src="${esc(m.poster)}" alt="${esc(m.title)}海報">`:'<div class="poster noposter">沒有海報</div>'}<div class="body"><div class="name">${esc(m.title)}</div><div class="meta">${esc(m.region)} · ${esc(m.date||'日期不詳')}</div><div class="rating">${m.watched?'✓ 已看':'未看'} · ${m.rating!=null?esc(m.rating)+'/10':'未評分'}</div>${m.favorite?'<div class="favorite">♥ 我的最愛</div>':''}</div></article>`).join(''):'<div class="empty">沒有符合條件的電影</div>'}
for(const id of ['q','status','region','rating','year','sort'])$(id).addEventListener(id==='q'?'input':'change',render);render();
</script></body></html>
